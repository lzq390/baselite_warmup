<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">fragment_vocab_v1 片段设计简图</title>
  <desc id="desc">从聚合物 repeat-unit 数据清洗、片段规则设计到图匹配和验证指标的简要说明图。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .page { fill: #f7f8fb; }
      .title { font: 700 34px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 17px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #4b5563; }
      .lane { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; rx: 8; }
      .lane-title { font: 700 20px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .lane-note { font: 400 14px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke-width: 1.5; rx: 8; }
      .box-blue { stroke: #2563eb; }
      .box-green { stroke: #059669; }
      .box-amber { stroke: #b45309; }
      .box-red { stroke: #dc2626; }
      .box-gray { stroke: #6b7280; }
      .box-fill-blue { fill: #eff6ff; stroke: #2563eb; }
      .box-fill-green { fill: #ecfdf5; stroke: #059669; }
      .box-fill-amber { fill: #fffbeb; stroke: #b45309; }
      .box-fill-red { fill: #fef2f2; stroke: #dc2626; }
      .box-title { font: 700 16px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .box-small { font: 400 13px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #374151; }
      .metric { font: 700 18px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .chip { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1; rx: 7; }
      .chip-text { font: 600 13px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #374151; }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #059669; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
      .arrow-amber { stroke: #b45309; stroke-width: 2.5; fill: none; marker-end: url(#arrow-amber); }
      .muted-line { stroke: #9ca3af; stroke-width: 1.4; fill: none; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="50" y="58">fragment_vocab_v1 片段设计简图</text>
  <text class="subtitle" x="50" y="88">目标：把 polymer repeat-unit SMILES 转成可执行、可验证、可复现的 fragment 规则词表，并支撑后续实例级匹配。</text>

  <rect class="lane" x="40" y="120" width="1520" height="205"/>
  <text class="lane-title" x="65" y="154">1. 数据准入与去重口径</text>
  <text class="lane-note" x="65" y="178">CSV 是 long-format 属性表，必须先按 polymer string 聚合，再进入两连接点 repeat-unit 主构建集。</text>

  <rect class="box box-fill-blue" x="65" y="210" width="175" height="74"/>
  <text class="box-title" x="86" y="238">CSV 属性记录</text>
  <text class="box-small" x="86" y="262">64,071 rows</text>

  <rect class="box box-blue" x="285" y="210" width="175" height="74"/>
  <text class="box-title" x="306" y="238">raw unique</text>
  <text class="box-small" x="306" y="262">23,956 strings</text>

  <rect class="box box-blue" x="505" y="210" width="175" height="74"/>
  <text class="box-title" x="526" y="238">main RU 候选</text>
  <text class="box-small" x="526" y="262">23,791 two-* units</text>

  <rect class="box box-blue" x="725" y="210" width="175" height="74"/>
  <text class="box-title" x="746" y="238">attachment 统一</text>
  <text class="box-small" x="746" y="262">12,184 unique</text>

  <rect class="box box-blue" x="945" y="210" width="175" height="74"/>
  <text class="box-title" x="966" y="238">RDKit canonical</text>
  <text class="box-small" x="966" y="262">11,580 RU unique</text>

  <rect class="box box-blue" x="1165" y="210" width="175" height="74"/>
  <text class="box-title" x="1186" y="238">graph hash</text>
  <text class="box-small" x="1186" y="262">11,439 粗略去重</text>

  <rect class="box box-fill-red" x="1385" y="210" width="135" height="74"/>
  <text class="box-title" x="1404" y="238">Level 5</text>
  <text class="box-small" x="1404" y="262">periodic hash</text>
  <text class="box-small" x="1404" y="279">待实现</text>

  <path class="arrow-blue" d="M 240 247 H 275"/>
  <path class="arrow-blue" d="M 460 247 H 495"/>
  <path class="arrow-blue" d="M 680 247 H 715"/>
  <path class="arrow-blue" d="M 900 247 H 935"/>
  <path class="arrow-blue" d="M 1120 247 H 1155"/>
  <path class="arrow-blue" d="M 1340 247 H 1375"/>

  <rect class="lane" x="40" y="350" width="1520" height="275"/>
  <text class="lane-title" x="65" y="384">2. fragment 规则设计与核心词表生成</text>
  <text class="lane-note" x="65" y="408">核心词表只保留匹配、归属、去重和冲突处理所需字段；统计、示例、审核信息放入辅助文件。</text>

  <rect class="box box-fill-green" x="65" y="445" width="185" height="78"/>
  <text class="box-title" x="88" y="474">seed rules</text>
  <text class="box-small" x="88" y="498">71 条人工/规则种子</text>

  <rect class="box box-green" x="300" y="445" width="185" height="78"/>
  <text class="box-title" x="323" y="474">schema 校验</text>
  <text class="box-small" x="323" y="498">71 valid / 0 invalid</text>

  <rect class="box box-green" x="535" y="445" width="185" height="78"/>
  <text class="box-title" x="558" y="474">覆盖率筛选</text>
  <text class="box-small" x="558" y="498">低频规则降级</text>

  <rect class="box box-fill-green" x="770" y="445" width="205" height="78"/>
  <text class="box-title" x="793" y="474">core vocab v1.0</text>
  <text class="box-small" x="793" y="498">60 条生产核心规则</text>

  <path class="arrow-green" d="M 250 484 H 290"/>
  <path class="arrow-green" d="M 485 484 H 525"/>
  <path class="arrow-green" d="M 720 484 H 760"/>

  <rect class="box box-green" x="1015" y="392" width="495" height="178"/>
  <text class="box-title" x="1040" y="424">单条 fragment rule 的必要结构</text>
  <rect class="chip" x="1040" y="448" width="130" height="32"/>
  <text class="chip-text" x="1056" y="469">id / version</text>
  <rect class="chip" x="1188" y="448" width="178" height="32"/>
  <text class="chip-text" x="1204" y="469">atom-mapped SMARTS</text>
  <rect class="chip" x="1382" y="448" width="100" height="32"/>
  <text class="chip-text" x="1398" y="469">category</text>
  <rect class="chip" x="1040" y="494" width="130" height="32"/>
  <text class="chip-text" x="1056" y="515">atom_roles</text>
  <rect class="chip" x="1188" y="494" width="145" height="32"/>
  <text class="chip-text" x="1204" y="515">anchor_rule</text>
  <rect class="chip" x="1351" y="494" width="131" height="32"/>
  <text class="chip-text" x="1367" y="515">ownership</text>
  <rect class="chip" x="1040" y="540" width="164" height="32"/>
  <text class="chip-text" x="1056" y="561">dedup_key_fields</text>
  <rect class="chip" x="1222" y="540" width="160" height="32"/>
  <text class="chip-text" x="1238" y="561">overlap_policy</text>
  <rect class="chip" x="1400" y="540" width="82" height="32"/>
  <text class="chip-text" x="1416" y="561">tags</text>

  <rect class="box box-fill-amber" x="300" y="545" width="185" height="50"/>
  <text class="box-title" x="323" y="576">motif mining</text>
  <text class="box-small" x="323" y="594">300 candidates</text>

  <rect class="box box-amber" x="535" y="545" width="205" height="50"/>
  <text class="box-title" x="558" y="576">人工审核队列</text>
  <text class="box-small" x="558" y="594">补齐稳定 anchor 后再提升</text>

  <path class="arrow-amber" d="M 485 570 H 525"/>
  <path class="muted-line" d="M 1020 484 H 985"/>
  <text class="lane-note" x="790" y="590">辅助产物：stats / examples / coverage / overlap / review reports</text>

  <rect class="lane" x="40" y="650" width="1520" height="290"/>
  <text class="lane-title" x="65" y="684">3. repeat-unit 图匹配与验证闭环</text>
  <text class="lane-note" x="65" y="708">最终输出由 anchor ownership 和 canonical instance key 决定；centered expansion 与 sliding scan 只提供候选。</text>

  <rect class="box box-fill-amber" x="65" y="744" width="200" height="78"/>
  <text class="box-title" x="88" y="773">graph + vocab</text>
  <text class="box-small" x="88" y="797">repeat_unit_graph</text>
  <text class="box-small" x="88" y="815">+ fragment_vocab_v1</text>

  <rect class="box box-amber" x="315" y="744" width="220" height="78"/>
  <text class="box-title" x="338" y="773">周期展开</text>
  <text class="box-small" x="338" y="797">RU[-1], RU[0], RU[+1]</text>
  <text class="box-small" x="338" y="815">periodic_radius = 1</text>

  <rect class="box box-amber" x="585" y="744" width="160" height="78"/>
  <text class="box-title" x="608" y="773">候选匹配</text>
  <text class="box-small" x="608" y="797">SMARTS / graph</text>
  <text class="box-small" x="608" y="815">candidate only</text>

  <rect class="box box-amber" x="795" y="744" width="175" height="78"/>
  <text class="box-title" x="818" y="773">anchor 归属</text>
  <text class="box-small" x="818" y="797">owner(anchor)</text>
  <text class="box-small" x="818" y="815">必须是 RU0</text>

  <rect class="box box-amber" x="1020" y="744" width="190" height="78"/>
  <text class="box-title" x="1043" y="773">实例去重</text>
  <text class="box-small" x="1043" y="797">canonical_instance_key</text>
  <text class="box-small" x="1043" y="815">防止重复计数</text>

  <rect class="box box-fill-amber" x="1260" y="744" width="240" height="78"/>
  <text class="box-title" x="1283" y="773">输出标签</text>
  <text class="box-small" x="1283" y="797">fragment_instances</text>
  <text class="box-small" x="1283" y="815">fragment_presence_labels</text>

  <path class="arrow-amber" d="M 265 783 H 305"/>
  <path class="arrow-amber" d="M 535 783 H 575"/>
  <path class="arrow-amber" d="M 745 783 H 785"/>
  <path class="arrow-amber" d="M 970 783 H 1010"/>
  <path class="arrow-amber" d="M 1210 783 H 1250"/>

  <rect class="box box-fill-green" x="65" y="855" width="420" height="58"/>
  <text class="metric" x="88" y="881">覆盖率：11,577 / 11,580 = 99.97%</text>
  <text class="box-small" x="88" y="903">平均每个 polymer 命中 9.30 个 fragment 类型，中位数 8</text>

  <rect class="box box-fill-amber" x="525" y="855" width="390" height="58"/>
  <text class="metric" x="548" y="881">重叠检查：120 对高重叠</text>
  <text class="box-small" x="548" y="903">同 exclusive_group 内冲突 64，需要 priority / policy 解释</text>

  <rect class="box box-fill-red" x="955" y="855" width="545" height="58"/>
  <text class="metric" x="978" y="881">剩余验证缺口：cut-shift 与边界归属</text>
  <text class="box-small" x="978" y="903">当前 schema 已预留字段，但仍依赖周期图 matcher 做最终验证</text>
</svg>
